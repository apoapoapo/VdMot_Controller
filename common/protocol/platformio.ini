; Host test project for the shared protocol library.
; Run: pio test -e native   (from common/protocol)

[platformio]
src_dir = src
include_dir = include
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu11
    -Wall -Wextra -Werror
    -Wconversion -Wno-sign-conversion
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
build_unflags = -std=gnu99
extra_scripts = post:test/asan_link.py

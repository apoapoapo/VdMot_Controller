; VdMot Controller v2 - STM32 firmware
;
; Build:  pio run -e f411_c2

[platformio]
default_envs = f411_c2

[fw]
version_major = 2
version_minor = 0
version_patch = 0

[env]
lib_deps =
    symlink://../../common/protocol
build_flags =
    -Isrc
    -DFW_VERSION_MAJOR=${fw.version_major}
    -DFW_VERSION_MINOR=${fw.version_minor}
    -DFW_VERSION_PATCH=${fw.version_patch}
    -Wall -Wextra

[stm32]
platform = ststm32@20.0.0
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
; USER_VECT_TAB_ADDRESS: SystemInit() points VTOR at the flash, so the
; firmware also runs when it is started by the bootloader's GO command
stm32_flags =
    -DUSER_VECT_TAB_ADDRESS
    -DSERIAL_RX_BUFFER_SIZE=512
    -DSERIAL_TX_BUFFER_SIZE=512

[env:f411_c2]
extends = stm32
board = blackpill_f411ce
build_flags =
    ${env.build_flags}
    ${stm32.stm32_flags}
    -DVDM_MCU=VDM_MCU_F411
    -DVDM_HW_REV=VDM_HW_C2

[env:f401_c2]
extends = stm32
board = blackpill_f401cc
build_flags =
    ${env.build_flags}
    ${stm32.stm32_flags}
    -DVDM_MCU=VDM_MCU_F401
    -DVDM_HW_REV=VDM_HW_C2

; Host tests of the hardware-independent core (src/core)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
    ${env.build_flags}
    -DUNITY_INCLUDE_DOUBLE
    -Werror
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
extra_scripts = post:test/asan_link.py

; VdMot Controller v2 - ESP32 (WT32-ETH01) firmware
;
; Build:  pio run -e wt32_eth01

[platformio]
default_envs = wt32_eth01

[fw]
version_major = 2
version_minor = 0
version_patch = 0

[env]
lib_deps =
    symlink://../../common/protocol
build_flags =
    -DFW_VERSION_MAJOR=${fw.version_major}
    -DFW_VERSION_MINOR=${fw.version_minor}
    -DFW_VERSION_PATCH=${fw.version_patch}
    -Wall -Wextra

[env:wt32_eth01]
platform = espressif32@6.9.0
framework = arduino
board = wt32-eth01
monitor_speed = 115200

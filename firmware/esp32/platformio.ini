; VdMot Controller v2 - ESP32 (WT32-ETH01) firmware
;
; Build:  pio run -e wt32_eth01

[platformio]
default_envs = wt32_eth01

[fw]
version_major = 2
version_minor = 0
version_patch = 0

[env]
lib_deps =
    symlink://../../common/protocol
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -Isrc
    -DFW_VERSION_MAJOR=${fw.version_major}
    -DFW_VERSION_MINOR=${fw.version_minor}
    -DFW_VERSION_PATCH=${fw.version_patch}
    -Wall -Wextra

[env:wt32_eth01]
platform = espressif32@6.9.0
framework = arduino
board = wt32-eth01
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8

; Host tests of the hardware-independent core (src/core). The integration
; test runs the STM32 core (../stm32/src/core) as the link peer.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
    ${env.build_flags}
    -I../stm32/src
    -I../stm32/test
    -DUNITY_INCLUDE_DOUBLE
    -Werror
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
extra_scripts = post:test/asan_link.py
